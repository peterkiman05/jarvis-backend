<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen - Continuous Voice Terminal</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 8px; text-align: center; }
        .btn-red { background-color: #da3633; color: white; }
        .btn-blue { background-color: #1f6feb; color: white; }
        .btn-green { background-color: #238636; color: white; }
        .terminal { background: #010409; border: 1px solid #30363d; border-radius: 6px; height: 350px; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .msg-user { color: #58a6ff; text-align: left; }
        .msg-assistant { color: #3fb950; text-align: left; white-space: pre-wrap; }
        .status { text-align: center; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        input[type="text"] { width: calc(100% - 22px); padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; font-family: monospace; margin-bottom: 8px; }
        video, img { width: 100%; border-radius: 6px; margin-top: 5px; max-height: 250px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #58a6ff; margin: 5px 0;">KIEMAEN VOICE STREAM</h2>
        
        <div class="card">
            <button id="toggleLoopBtn" class="btn btn-green" onclick="toggleContinuousSession()">🎙️ Start Continuous AI Voice Mode</button>
            <input type="text" id="textInput" placeholder="Type text fallback..." onkeydown="if(event.key==='Enter') sendText()">
            <button class="btn btn-blue" onclick="sendText()">Send Text</button>
            <button class="btn btn-red" onclick="clearMemory()">🧹 Clear Memory</button>
            <div id="status" class="status">Status: Standby</div>
        </div>

        <div class="card">
            <div id="terminal" class="terminal">
                <div class="msg-assistant">Kiemaen: Continuous voice engine online. Click the green button to start talking live.</div>
            </div>
        </div>

        <div class="card" id="mediaContainer" style="display:none;">
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 4px;">Visual Output Stream:</div>
            <div id="mediaOutput"></div>
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isContinuousActive = false;
        let isListening = false;
        let speechTimeout = null;

        function toggleContinuousSession() {
            if (!isContinuousActive) {
                isContinuousActive = true;
                document.getElementById("toggleLoopBtn").innerText = "⏹️ Stop Continuous Mode";
                document.getElementById("toggleLoopBtn").className = "btn btn-red";
                updateStatus("Status: Continuous Stream Active (Listening...)");
                startListeningLoop();
            } else {
                isContinuousActive = false;
                stopListeningLoop();
                document.getElementById("toggleLoopBtn").innerText = "🎙️ Start Continuous AI Voice Mode";
                document.getElementById("toggleLoopBtn").className = "btn btn-green";
                updateStatus("Status: Standby");
            }
        }

        async function startListeningLoop() {
            if (!isContinuousActive) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    if (!isContinuousActive) return;
                    updateStatus("Status: Kiemaen is thinking...");
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append("file", audioBlob, "voice.webm");

                    try {
                        const transRes = await fetch('/transcribe', { method: 'POST', body: formData });
                        const transData = await transRes.json();
                        
                        if (transData.text && transData.text.trim().length > 1) {
                            appendTerminal("User: " + transData.text, "msg-user");

                            const chatRes = await fetch('/chat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: transData.text })
                            });
                            const chatData = await chatRes.json();
                            appendTerminal("Kiemaen: " + chatData.reply, "msg-assistant");
                            handleMediaOutputs(chatData.reply);

                            speakAndListenAgain(chatData.reply);
                        } else {
                            if (isContinuousActive) startListeningLoop();
                        }
                    } catch (err) {
                        console.log("Loop Error:", err);
                        if (isContinuousActive) setTimeout(startListeningLoop, 2000);
                    }
                };

                mediaRecorder.start();
                isListening = true;
                updateStatus("Status: Listening... (Speak now)");

                clearTimeout(speechTimeout);
                speechTimeout = setTimeout(() => {
                    if (isListening && mediaRecorder && mediaRecorder.state === "recording") {
                        isListening = false;
                        mediaRecorder.stop();
                    }
                }, 6000);

            } catch (e) {
                alert("Microphone permission needed for continuous mode.");
                toggleContinuousSession();
            }
        }

        function stopListeningLoop() {
            isListening = false;
            clearTimeout(speechTimeout);
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }

        function speakAndListenAgain(text) {
            const cleanText = text.replace(/https?:\/\/[^\s]+/g, "").substring(0, 300);
            if (!cleanText.trim()) {
                if (isContinuousActive) setTimeout(startListeningLoop, 2000);
                return;
            }

            updateStatus("Status: Kiemaen is speaking...");
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                utterance.onend = () => {
                    if (isContinuousActive) {
                        updateStatus("Status: Pausing (2s buffer)...");
                        // Exact 2-second delay buffer after speech ends before listening again
                        setTimeout(() => {
                            if (isContinuousActive) startListeningLoop();
                        }, 2000);
                    }
                };

                utterance.onerror = () => {
                    if (isContinuousActive) setTimeout(startListeningLoop, 2000);
                };

                window.speechSynthesis.speak(utterance);
            } else {
                if (isContinuousActive) setTimeout(startListeningLoop, 2000);
            }
        }

        async function sendText() {
            const input = document.getElementById("textInput");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            appendTerminal("User: " + text, "msg-user");

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            appendTerminal("Kiemaen: " + data.reply, "msg-assistant");
            handleMediaOutputs(data.reply);
            speakAndListenAgain(data.reply);
        }

        function handleMediaOutputs(reply) {
            const container = document.getElementById("mediaContainer");
            const output = document.getElementById("mediaOutput");
            const urlMatch = reply.match(/(https?:\/\/[^\s]+)/g);
            if (urlMatch) {
                const url = urlMatch[urlMatch.length - 1];
                container.style.display = "block";
                if (url.includes(".mp4") || url.includes("mov")) {
                    output.innerHTML = `<video controls autoplay src="${url}"></video>`;
                } else if (url.includes("image.pollinations.ai")) {
                    output.innerHTML = `<img src="${url}" alt="Visual">`;
                }
            }
        }

        function appendTerminal(text, className) {
            const term = document.getElementById("terminal");
            const div = document.createElement("div");
            div.className = className;
            div.innerText = text;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function clearMemory() {
            await fetch('/memory/reset', { method: 'DELETE' });
            document.getElementById("terminal").innerHTML = '<div class="msg-assistant">Kiemaen: Memory reset.</div>';
        }

        function updateStatus(text) {
            document.getElementById("status").innerText = text;
        }
    </script>
</body>
</html>
