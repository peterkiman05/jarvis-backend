<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen - Autonomous Quantitative Terminal</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 8px; text-align: center; }
        .btn-red { background-color: #da3633; color: white; }
        .btn-blue { background-color: #1f6feb; color: white; }
        .btn-green { background-color: #238636; color: white; }
        .terminal { background: #010409; border: 1px solid #30363d; border-radius: 6px; height: 350px; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .msg-user { color: #58a6ff; text-align: left; }
        .msg-assistant { color: #3fb950; text-align: left; white-space: pre-wrap; }
        .status { text-align: center; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        input[type="text"] { width: calc(100% - 22px); padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; font-family: monospace; margin-bottom: 8px; }
        video, img { width: 100%; border-radius: 6px; margin-top: 5px; max-height: 250px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #58a6ff; margin: 5px 0;">KIEMAEN TERMINAL v2.5</h2>
        
        <div class="card">
            <button id="recordBtn" class="btn btn-green" onclick="toggleVoiceSession()">🎤 Start Voice-to-Voice Stream</button>
            <input type="text" id="textInput" placeholder="Type command to Kiemaen..." onkeydown="if(event.key==='Enter') sendText()">
            <button class="btn btn-blue" onclick="sendText()">Send Command</button>
            <button class="btn btn-red" onclick="clearMemory()">🧹 Clear Persistent Memory</button>
            <div id="status" class="status">Status: Standby</div>
        </div>

        <div class="card">
            <div id="terminal" class="terminal">
                <div class="msg-assistant">Kiemaen: Systems online. Voice-to-voice stream ready. How can I assist your portfolio today?</div>
            </div>
        </div>

        <div class="card" id="mediaContainer" style="display:none;">
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 4px;">Visual Output Stream:</div>
            <div id="mediaOutput"></div>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        async function toggleVoiceSession() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        updateStatus("Kiemaen is processing audio stream...");
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const formData = new FormData();
                        formData.append("file", audioBlob, "voice_prompt.webm");

                        try {
                            const transRes = await fetch('/transcribe', { method: 'POST', body: formData });
                            const transData = await transRes.json();
                            if (!transData.text) throw new Error("Transcription failed");

                            appendTerminal("User: " + transData.text, "msg-user");

                            const chatRes = await fetch('/chat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: transData.text })
                            });
                            const chatData = await chatRes.json();
                            appendTerminal("Kiemaen: " + chatData.reply, "msg-assistant");
                            handleMediaOutputs(chatData.reply);
                            playKiemaenVoice(chatData.reply);

                        } catch (err) {
                            appendTerminal("Error: " + err.message, "msg-assistant");
                            updateStatus("Status: Error");
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    document.getElementById("recordBtn").innerText = "⏹️ Stop & Send Voice Stream";
                    document.getElementById("recordBtn").className = "btn btn-red";
                    updateStatus("Status: Listening live...");
                } catch (e) {
                    alert("Microphone access denied or unsupported.");
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById("recordBtn").innerText = "🎤 Start Voice-to-Voice Stream";
                document.getElementById("recordBtn").className = "btn btn-green";
                updateStatus("Status: Standby");
            }
        }

        async function sendText() {
            const input = document.getElementById("textInput");
            const text = input.value.trim();
            if (!text) return;

            input.value = "";
            appendTerminal("User: " + text, "msg-user");
            updateStatus("Kiemaen is analyzing...");

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                appendTerminal("Kiemaen: " + data.reply, "msg-assistant");
                handleMediaOutputs(data.reply);
                playKiemaenVoice(data.reply);
                updateStatus("Status: Standby");
            } catch (err) {
                appendTerminal("Error connecting to server.", "msg-assistant");
                updateStatus("Status: Error");
            }
        }

        async function playKiemaenVoice(text) {
            try {
                const cleanText = text.replace(/https?:\/\/[^\s]+/g, "").substring(0, 300);
                if (!cleanText.trim()) return;

                const res = await fetch('/tts/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: cleanText })
                });
                if (!res.ok) return;

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                const player = document.getElementById("audioPlayer");
                player.src = audioUrl;
                player.play();
            } catch (e) {
                console.log("TTS playback skipped:", e);
            }
        }

        function handleMediaOutputs(reply) {
            const container = document.getElementById("mediaContainer");
            const output = document.getElementById("mediaOutput");
            
            const urlMatch = reply.match(/(https?:\/\/[^\s]+)/g);
            if (urlMatch) {
                const url = urlMatch[urlMatch.length - 1];
                container.style.display = "block";
                if (url.includes(".mp4") || url.includes("mov")) {
                    output.innerHTML = `<video controls autoplay src="${url}"></video>`;
                } else if (url.includes("image.pollinations.ai")) {
                    output.innerHTML = `<img src="${url}" alt="Generated Visual">`;
                }
            }
        }

        function appendTerminal(text, className) {
            const term = document.getElementById("terminal");
            const div = document.createElement("div");
            div.className = className;
            div.innerText = text;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function clearMemory() {
            await fetch('/memory/reset', { method: 'DELETE' });
            document.getElementById("terminal").innerHTML = '<div class="msg-assistant">Kiemaen: Persistent memory wiped clean.</div>';
        }

        function updateStatus(text) {
            document.getElementById("status").innerText = text;
        }
    </script>
</body>
</html>
