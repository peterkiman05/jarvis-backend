<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Terminal</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 15px; max-width: 800px; margin: auto; }
        h1 { color: #58a6ff; font-size: 1.4rem; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { background: #238636; color: #fff; border: none; padding: 14px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; }
        button.active { background: #da3633; }
        #status { font-size: 0.9rem; color: #8b949e; margin-top: 10px; text-align: center; }
        #chat-log { height: 280px; overflow-y: auto; background: #010409; padding: 12px; border-radius: 6px; border: 1px solid #30363d; margin-bottom: 10px; white-space: pre-wrap; }
        .user { color: #79c0ff; margin: 8px 0; font-weight: bold; }
        .jarvis { color: #7ee787; margin: 8px 0; }
        .media-container { text-align: center; margin-top: 10px; }
        img, video { max-width: 100%; border-radius: 8px; border: 1px solid #30363d; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>JARVIS Voice & Multimodal Terminal</h1>
    
    <div class="card">
        <button id="mic-btn" onclick="toggleVoice()">🎙️ Push to Talk</button>
        <div id="status">Status: Standby</div>
    </div>

    <div class="card">
        <div id="chat-log"></div>
        <div id="media-output" class="media-container"></div>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const mediaOutput = document.getElementById('media-output');
        const status = document.getElementById('status');
        const micBtn = document.getElementById('mic-btn');
        let recognizing = false;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            status.innerText = "Error: Speech Recognition API not supported in this browser. Use Chrome or Brave.";
        }

        const recognition = SpeechRecognition ? new SpeechRecognition() : null;
        if (recognition) {
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => { status.innerText = "Status: Listening... Speak now."; };
            recognition.onerror = (e) => { 
                status.innerText = "Speech Error: " + e.error; 
                resetButton();
            };
            recognition.onend = () => { if (recognizing) status.innerText = "Status: Processing audio..."; };

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (!transcript) return;

                appendLog("User", transcript);
                status.innerText = "Status: JARVIS responding...";

                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: transcript })
                    });

                    const data = await response.json();
                    appendLog("JARVIS", data.reply);

                    if (data.reply.includes("http")) {
                        const urlMatch = data.reply.match(/(https?:\/\/[^\s]+)/g);
                        if (urlMatch) {
                            const url = urlMatch[0];
                            if (url.includes(".mp4")) {
                                mediaOutput.innerHTML = `<video src="${url}" controls autoplay loop></video>`;
                            } else {
                                mediaOutput.innerHTML = `<img src="${url}" alt="Rendered Media">`;
                            }
                        }
                    }

                    if ('speechSynthesis' in window) {
                        const speakableText = data.reply.replace(/(https?:\/\/[^\s]+)/g, "Media rendered on screen.");
                        window.speechSynthesis.cancel();
                        window.speechSynthesis.speak(new SpeechSynthesisUtterance(speakableText));
                    }

                } catch (err) {
                    status.innerText = "Error reaching JARVIS backend.";
                } finally {
                    resetButton();
                }
            };
        }

        function toggleVoice() {
            if (!recognition) {
                status.innerText = "Speech Recognition not available.";
                return;
            }
            if (!recognizing) {
                try {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                    }
                    recognition.start();
                    recognizing = true;
                    micBtn.innerText = "🛑 Recording... (Tap when done)";
                    micBtn.classList.add("active");
                } catch(e) {
                    status.innerText = "Mic Error: " + e.message;
                }
            } else {
                recognition.stop();
                resetButton();
            }
        }

        function resetButton() {
            recognizing = false;
            micBtn.innerText = "🎙️ Push to Talk";
            micBtn.classList.remove("active");
            if (status.innerText.includes("Listening") || status.innerText.includes("Processing")) {
                status.innerText = "Status: Standby";
            }
        }

        function appendLog(role, text) {
            const div = document.createElement('div');
            div.className = role.toLowerCase();
            div.innerText = `${role}: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
