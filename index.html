<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiemaen - Omni Autonomous Terminal</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 8px; text-align: center; }
        .btn-red { background-color: #da3633; color: white; }
        .btn-blue { background-color: #1f6feb; color: white; }
        .btn-green { background-color: #238636; color: white; }
        .btn-purple { background-color: #8957e5; color: white; }
        .btn-orange { background-color: #d18616; color: white; }
        .terminal { background: #010409; border: 1px solid #30363d; border-radius: 6px; height: 350px; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .msg-user { color: #58a6ff; text-align: left; }
        .msg-assistant { color: #3fb950; text-align: left; white-space: pre-wrap; }
        .status { text-align: center; font-size: 13px; color: #8b949e; margin-bottom: 5px; }
        input[type="text"] { width: calc(100% - 22px); padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; font-family: monospace; margin-bottom: 8px; }
        input[type="file"] { width: 100%; margin-bottom: 8px; color: #8b949e; }
        video, img { width: 100%; border-radius: 6px; margin-top: 5px; max-height: 250px; object-fit: cover; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #58a6ff; margin: 5px 0;">KIEMAEN OMNI TERMINAL</h2>
        
        <div class="card">
            <button class="btn btn-purple" onclick="testAudioUnlock()">🔊 Tap to Unlock Audio</button>
            <button id="toggleLoopBtn" class="btn btn-green" onclick="toggleContinuousSession()">🎙️ Start Continuous Omni-Mode (Unlimited Listen)</button>
            <button id="manualStopBtn" class="btn btn-red" style="display:none;" onclick="stopSpeakingAndSend()">🛑 Done Talking (Process Now)</button>
            
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 2px;">Upload Chart for Vision Analysis:</div>
            <input type="file" id="chartInput" accept="image/*">
            <button class="btn btn-orange" onclick="uploadChart()">📊 Analyze Chart Image</button>

            <input type="text" id="textInput" placeholder="Ask engineering, trading, or video requests..." onkeydown="if(event.key==='Enter') sendText()">
            <button class="btn btn-blue" onclick="sendText()">Send Command</button>
            <button class="btn btn-red" onclick="clearMemory()">🧹 Clear Memory</button>
            <div id="status" class="status">Status: Standby</div>
        </div>

        <div class="card">
            <div id="terminal" class="terminal">
                <div class="msg-assistant">Kiemaen: Omni-engine online. Unlimited listening mode and full-length reading enabled.</div>
            </div>
        </div>

        <div class="card" id="mediaContainer" style="display:none;">
            <div style="font-size: 12px; color: #8b949e; margin-bottom: 4px;">Visual/Video Output Stream:</div>
            <div id="mediaOutput"></div>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isContinuousActive = false;
        let isListening = false;

        async function testAudioUnlock() {
            try {
                const res = await fetch('/tts/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: "Audio unlocked successfully." })
                });
                const blob = await res.blob();
                const player = document.getElementById("audioPlayer");
                player.src = URL.createObjectURL(blob);
                await player.play();
                updateStatus("Status: Audio Unlocked!");
            } catch (e) {
                alert("Audio unlock failed: " + e.message);
            }
        }

        function toggleContinuousSession() {
            if (!isContinuousActive) {
                isContinuousActive = true;
                document.getElementById("toggleLoopBtn").innerText = "⏹️ Stop Continuous Mode";
                document.getElementById("toggleLoopBtn").className = "btn btn-red";
                document.getElementById("manualStopBtn").style.display = "block";
                updateStatus("Status: Listening indefinitely (Speak freely)...");
                startUnlimitedListening();
            } else {
                isContinuousActive = false;
                stopListening();
                document.getElementById("toggleLoopBtn").innerText = "🎙️ Start Continuous Omni-Mode (Unlimited Listen)";
                document.getElementById("toggleLoopBtn").className = "btn btn-green";
                document.getElementById("manualStopBtn").style.display = "none";
                updateStatus("Status: Standby");
            }
        }

        async function startUnlimitedListening() {
            if (!isContinuousActive) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    if (!isContinuousActive) return;
                    updateStatus("Status: Kiemaen is processing your full request...");
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append("file", audioBlob, "voice.webm");

                    try {
                        const transRes = await fetch('/transcribe', { method: 'POST', body: formData });
                        const transData = await transRes.json();
                        
                        if (transData.text && transData.text.trim().length > 1) {
                            appendTerminal("User: " + transData.text, "msg-user");

                            const chatRes = await fetch('/chat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: transData.text })
                            });
                            const chatData = await chatRes.json();
                            appendTerminal("Kiemaen: " + chatData.reply, "msg-assistant");
                            handleMediaOutputs(chatData.reply);

                            await speakFullAnswerAndListen(chatData.reply);
                        } else {
                            if (isContinuousActive) startUnlimitedListening();
                        }
                    } catch (err) {
                        console.log("Loop Error:", err);
                        if (isContinuousActive) setTimeout(startUnlimitedListening, 2000);
                    }
                };

                mediaRecorder.start();
                isListening = true;
                updateStatus("Status: Listening live (Tap 'Done Talking' when finished)...");

            } catch (e) {
                alert("Microphone permission needed.");
                toggleContinuousSession();
            }
        }

        function stopSpeakingAndSend() {
            if (isListening && mediaRecorder && mediaRecorder.state === "recording") {
                isListening = false;
                mediaRecorder.stop();
                document.getElementById("manualStopBtn").style.display = "none";
            }
        }

        function stopListening() {
            isListening = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }

        async function speakFullAnswerAndListen(text) {
            // Removes markdown links/URLs from speech audio while reading the entire text response
            const cleanText = text.replace(/https?:\/\/[^\s]+/g, "");
            if (!cleanText.trim()) {
                if (isContinuousActive) {
                    document.getElementById("manualStopBtn").style.display = "block";
                    startUnlimitedListening();
                }
                return;
            }

            updateStatus("Status: Kiemaen is reading the full answer...");

            try {
                const res = await fetch('/tts/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: cleanText })
                });

                if (!res.ok) {
                    if (isContinuousActive) {
                        document.getElementById("manualStopBtn").style.display = "block";
                        startUnlimitedListening();
                    }
                    return;
                }

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                const player = document.getElementById("audioPlayer");
                player.src = audioUrl;

                player.onended = () => {
                    if (isContinuousActive) {
                        updateStatus("Status: Pausing (2s buffer)... Ready for next input.");
                        setTimeout(() => {
                            if (isContinuousActive) {
                                document.getElementById("manualStopBtn").style.display = "block";
                                startUnlimitedListening();
                            }
                        }, 2000);
                    }
                };

                await player.play();
            } catch (e) {
                console.log("Voice error:", e);
                if (isContinuousActive) {
                    document.getElementById("manualStopBtn").style.display = "block";
                    startUnlimitedListening();
                }
            }
        }

        async function sendText() {
            const input = document.getElementById("textInput");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            appendTerminal("User: " + text, "msg-user");

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            appendTerminal("Kiemaen: " + data.reply, "msg-assistant");
            handleMediaOutputs(data.reply);
            speakFullAnswerAndListen(data.reply);
        }

        async function uploadChart() {
            const fileInput = document.getElementById("chartInput");
            if (fileInput.files.length === 0) {
                alert("Please select a chart image first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            appendTerminal("User: [Uploaded Chart Image for Analysis]", "msg-user");
            updateStatus("Status: Analyzing chart...");

            try {
                const res = await fetch('/analyze-chart', { method: 'POST', body: formData });
                const data = await res.json();
                const analysisText = data.analysis || data.detail || "Analysis complete.";
                appendTerminal("Kiemaen: " + analysisText, "msg-assistant");
                speakFullAnswerAndListen(analysisText);
            } catch (e) {
                alert("Chart analysis failed: " + e.message);
            }
            updateStatus("Status: Standby");
        }

        function handleMediaOutputs(reply) {
            const container = document.getElementById("mediaContainer");
            const output = document.getElementById("mediaOutput");
            const urlMatch = reply.match(/(https?:\/\/[^\s]+)/g);
            if (urlMatch) {
                const url = urlMatch[urlMatch.length - 1];
                container.style.display = "block";
                if (url.includes(".mp4") || url.includes("mov")) {
                    output.innerHTML = `<video controls autoplay src="${url}"></video>`;
                } else if (url.includes("image.pollinations.ai")) {
                    output.innerHTML = `<img src="${url}" alt="Visual">`;
                }
            }
        }

        function appendTerminal(text, className) {
            const term = document.getElementById("terminal");
            const div = document.createElement("div");
            div.className = className;
            div.innerText = text;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function clearMemory() {
            await fetch('/memory/reset', { method: 'DELETE' });
            document.getElementById("terminal").innerHTML = '<div class="msg-assistant">Kiemaen: Memory reset.</div>';
        }

        function updateStatus(text) {
            document.getElementById("status").innerText = text;
        }
    </script>
</body>
</html>
