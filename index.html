<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIEMAEN // OMNI-HUD v4.0</title>
    <style>
        :root {
            --bg-deep: #030712;
            --surface: #0f172a;
            --surface-glass: rgba(15, 23, 42, 0.75);
            --border: #1e293b;
            --accent-cyan: #38bdf8;
            --accent-green: #22c55e;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hud-header {
            text-align: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .hud-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            margin: 0;
        }

        .hud-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.2s ease;
            text-align: center;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
        }

        .btn-full { grid-column: span 2; }
        .btn-purple { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.3); }
        .btn-green { background: rgba(34, 197, 94, 0.15); color: #86efac; border-color: rgba(34, 197, 94, 0.3); }
        .btn-red { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
        .btn-blue { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.3); }
        .btn-orange { background: rgba(249, 115, 22, 0.15); color: #fdba74; border-color: rgba(249, 115, 22, 0.3); }

        .terminal {
            background: #020617;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 380px;
            overflow-y: auto;
            padding: 12px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }

        .msg-user { color: var(--accent-cyan); text-align: left; }
        .msg-assistant { color: var(--accent-green); text-align: left; white-space: pre-wrap; line-height: 1.4; }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #020617;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }

        .file-upload-box {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #020617;
            border: 1px dashed var(--border);
            padding: 8px 12px;
            border-radius: 8px;
        }

        input[type="file"] { color: var(--text-muted); font-size: 11px; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        video, img {
            width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            max-height: 260px;
            object-fit: cover;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hud-header">
            <h1 class="hud-title">KIEMAEN // OMNI-HUD</h1>
            <div class="hud-subtitle">AUTONOMOUS NEURAL INTERFACE &bull; J.P. SITHOLE</div>
        </div>
        
        <div class="card">
            <div class="btn-grid">
                <button class="btn btn-purple" onclick="testAudioUnlock()">🔊 Unlock Audio</button>
                <button class="btn btn-red" onclick="clearMemory()">🧹 Reset Memory</button>
                <button id="toggleLoopBtn" class="btn btn-green btn-full" onclick="toggleContinuousSession()">🎙️ Start Continuous Omni-Mode (Unlimited)</button>
                <button id="manualStopBtn" class="btn btn-red btn-full" style="display:none;" onclick="stopSpeakingAndSend()">🛑 Done Talking (Process Now)</button>
            </div>

            <div class="file-upload-box">
                <span>Vision Chart / Diagram:</span>
                <input type="file" id="chartInput" accept="image/*">
            </div>
            <button class="btn btn-orange" style="margin-top: 8px;" onclick="uploadChart()">📊 Analyze Uploaded Diagram</button>

            <div class="input-group">
                <input type="text" id="textInput" placeholder="Enter command for engineering, trading, or R&D..." onkeydown="if(event.key==='Enter') sendText()">
                <button class="btn btn-blue" onclick="sendText()">Transmit Command</button>
            </div>

            <div class="status-bar">
                <div><span class="status-indicator"></span><span id="status">System Status: Standby</span></div>
                <div>SECURE LINK ACTIVE</div>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px;">TERMINAL FEED:</div>
            <div id="terminal" class="terminal">
                <div class="msg-assistant">Kiemaen: HUD online. Neural voice link established. Ready for civil engineering, quantitative trading, and R&D protocols.</div>
            </div>
        </div>

        <div class="card" id="mediaContainer" style="display:none;">
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 1px;">GENERATED MEDIA STREAM:</div>
            <div id="mediaOutput"></div>
        </div>
    </div>

    <audio id="audioPlayer" style="display:none;"></audio>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let isContinuousActive = false;
        let isListening = false;

        async function testAudioUnlock() {
            try {
                const res = await fetch('/tts/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: "Audio subsystem unlocked successfully." })
                });
                const blob = await res.blob();
                const player = document.getElementById("audioPlayer");
                player.src = URL.createObjectURL(blob);
                await player.play();
                updateStatus("Audio Subsystem Active");
            } catch (e) {
                alert("Audio unlock failed: " + e.message);
            }
        }

        function toggleContinuousSession() {
            if (!isContinuousActive) {
                isContinuousActive = true;
                document.getElementById("toggleLoopBtn").innerText = "⏹️ Stop Continuous Mode";
                document.getElementById("toggleLoopBtn").className = "btn btn-red btn-full";
                document.getElementById("manualStopBtn").style.display = "block";
                updateStatus("Listening Indefinitely (Speak Freely)...");
                startUnlimitedListening();
            } else {
                isContinuousActive = false;
                stopListening();
                document.getElementById("toggleLoopBtn").innerText = "🎙️ Start Continuous Omni-Mode (Unlimited)";
                document.getElementById("toggleLoopBtn").className = "btn btn-green btn-full";
                document.getElementById("manualStopBtn").style.display = "none";
                updateStatus("System Status: Standby");
            }
        }

        async function startUnlimitedListening() {
            if (!isContinuousActive) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                audioChunks = [];

                mediaRecorder.ondataavailable = e => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    if (!isContinuousActive) return;
                    updateStatus("Processing Neural Audio Stream...");
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const formData = new FormData();
                    formData.append("file", audioBlob, "voice.webm");

                    try {
                        const transRes = await fetch('/transcribe', { method: 'POST', body: formData });
                        const transData = await transRes.json();
                        
                        if (transData.text && transData.text.trim().length > 1) {
                            appendTerminal("User: " + transData.text, "msg-user");

                            const chatRes = await fetch('/chat', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ message: transData.text })
                            });
                            const chatData = await chatRes.json();
                            appendTerminal("Kiemaen: " + chatData.reply, "msg-assistant");
                            handleMediaOutputs(chatData.reply);

                            await speakFullAnswerAndListen(chatData.reply);
                        } else {
                            if (isContinuousActive) {
                                document.getElementById("manualStopBtn").style.display = "block";
                                startUnlimitedListening();
                            }
                        }
                    } catch (err) {
                        console.log("Loop Error:", err);
                        if (isContinuousActive) {
                            setTimeout(() => {
                                document.getElementById("manualStopBtn").style.display = "block";
                                startUnlimitedListening();
                            }, 2000);
                        }
                    }
                };

                mediaRecorder.start();
                isListening = true;
                updateStatus("Live Listening (Tap 'Done Talking' when finished)");

            } catch (e) {
                alert("Microphone permission required.");
                toggleContinuousSession();
            }
        }

        function stopSpeakingAndSend() {
            if (isListening && mediaRecorder && mediaRecorder.state === "recording") {
                isListening = false;
                mediaRecorder.stop();
                document.getElementById("manualStopBtn").style.display = "none";
            }
        }

        function stopListening() {
            isListening = false;
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
            }
        }

        async function speakFullAnswerAndListen(text) {
            const cleanText = text.replace(/https?:\/\/[^\s]+/g, "");
            if (!cleanText.trim()) {
                if (isContinuousActive) {
                    document.getElementById("manualStopBtn").style.display = "block";
                    startUnlimitedListening();
                }
                return;
            }

            updateStatus("Synthesizing Full Speech Output...");

            try {
                const res = await fetch('/tts/speak', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: cleanText })
                });

                if (!res.ok) {
                    if (isContinuousActive) {
                        document.getElementById("manualStopBtn").style.display = "block";
                        startUnlimitedListening();
                    }
                    return;
                }

                const blob = await res.blob();
                const audioUrl = URL.createObjectURL(blob);
                const player = document.getElementById("audioPlayer");
                player.src = audioUrl;

                player.onended = () => {
                    if (isContinuousActive) {
                        updateStatus("Buffer Pause (2s)... Ready");
                        setTimeout(() => {
                            if (isContinuousActive) {
                                document.getElementById("manualStopBtn").style.display = "block";
                                startUnlimitedListening();
                            }
                        }, 2000);
                    }
                };

                await player.play();
            } catch (e) {
                console.log("Voice error:", e);
                if (isContinuousActive) {
                    document.getElementById("manualStopBtn").style.display = "block";
                    startUnlimitedListening();
                }
            }
        }

        async function sendText() {
            const input = document.getElementById("textInput");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            appendTerminal("User: " + text, "msg-user");
            updateStatus("Transmitting Command...");

            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            appendTerminal("Kiemaen: " + data.reply, "msg-assistant");
            handleMediaOutputs(data.reply);
            speakFullAnswerAndListen(data.reply);
        }

        async function uploadChart() {
            const fileInput = document.getElementById("chartInput");
            if (fileInput.files.length === 0) {
                alert("Please select a diagram or chart image first.");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            appendTerminal("User: [Uploaded Diagram/Chart for Analysis]", "msg-user");
            updateStatus("Running Vision Neural Scan...");

            try {
                const res = await fetch('/analyze-chart', { method: 'POST', body: formData });
                const data = await res.json();
                const analysisText = data.analysis || data.detail || "Analysis complete.";
                appendTerminal("Kiemaen: " + analysisText, "msg-assistant");
                speakFullAnswerAndListen(analysisText);
            } catch (e) {
                alert("Chart analysis failed: " + e.message);
            }
            updateStatus("System Status: Standby");
        }

        function handleMediaOutputs(reply) {
            const container = document.getElementById("mediaContainer");
            const output = document.getElementById("mediaOutput");
            const urlMatch = reply.match(/(https?:\/\/[^\s]+)/g);
            if (urlMatch) {
                const url = urlMatch[urlMatch.length - 1];
                container.style.display = "block";
                if (url.includes(".mp4") || url.includes("mov")) {
                    output.innerHTML = `<video controls autoplay src="${url}"></video>`;
                } else if (url.includes("image.pollinations.ai")) {
                    output.innerHTML = `<img src="${url}" alt="Visual Render">`;
                }
            }
        }

        function appendTerminal(text, className) {
            const term = document.getElementById("terminal");
            const div = document.createElement("div");
            div.className = className;
            div.innerText = text;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        async function clearMemory() {
            await fetch('/memory/reset', { method: 'DELETE' });
            document.getElementById("terminal").innerHTML = '<div class="msg-assistant">Kiemaen: Memory reset. Neural state re-initialized.</div>';
            updateStatus("Memory Purged");
        }

        function updateStatus(text) {
            document.getElementById("status").innerText = "Status: " + text;
        }
    </script>
</body>
</html>
