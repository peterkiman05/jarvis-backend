<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Terminal</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; padding: 15px; max-width: 800px; margin: auto; }
        h1 { color: #58a6ff; font-size: 1.4rem; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        button { background: #238636; color: #fff; border: none; padding: 14px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 8px; }
        button.active { background: #da3633; }
        #status { font-size: 0.9rem; color: #8b949e; margin-top: 10px; text-align: center; }
        #chat-log { height: 280px; overflow-y: auto; background: #010409; padding: 12px; border-radius: 6px; border: 1px solid #30363d; margin-bottom: 10px; white-space: pre-wrap; }
        .user { color: #79c0ff; margin: 8px 0; font-weight: bold; }
        .jarvis { color: #7ee787; margin: 8px 0; }
        .media-container { text-align: center; margin-top: 10px; }
        img, video { max-width: 100%; border-radius: 8px; border: 1px solid #30363d; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>JARVIS Multimodal Terminal</h1>
    
    <div class="card">
        <button id="mic-btn" onclick="toggleWebSpeech()">🎙️ Push to Talk (WebSpeech)</button>
        <button id="record-btn" onclick="toggleMediaRecorder()">🔴 Record Audio (Whisper Fallback)</button>
        <div id="status">Status: Standby</div>
    </div>

    <div class="card">
        <div id="chat-log"></div>
        <div id="media-output" class="media-container"></div>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');
        const mediaOutput = document.getElementById('media-output');
        const status = document.getElementById('status');
        const micBtn = document.getElementById('mic-btn');
        const recordBtn = document.getElementById('record-btn');
        
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // 1. WHISPER AUDIO FALLBACK (DYNAMIC MIME TYPES)
        async function toggleMediaRecorder() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    let mimeType = 'audio/webm';
                    if (!MediaRecorder.isTypeSupported('audio/webm')) {
                        mimeType = '';
                    }

                    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const actualType = mediaRecorder.mimeType || 'audio/webm';
                        const ext = actualType.includes('mp4') ? 'mp4' : 'webm';
                        const audioBlob = new Blob(audioChunks, { type: actualType });
                        
                        const formData = new FormData();
                        formData.append('file', audioBlob, `voice.${ext}`);

                        status.innerText = "Status: Transcribing via Whisper...";
                        try {
                            const res = await fetch('/transcribe', { method: 'POST', body: formData });
                            const data = await res.json();
                            if (data.text) {
                                sendChat(data.text);
                            } else {
                                status.innerText = "Transcription Error: " + JSON.stringify(data);
                            }
                        } catch(e) {
                            status.innerText = "Server Error during transcription";
                        }
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = "⏹️ Stop Recording & Send";
                    recordBtn.classList.add("active");
                    status.innerText = "Status: Recording audio directly...";
                } catch(err) {
                    status.innerText = "Mic Error: " + err.message;
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "🔴 Record Audio (Whisper Fallback)";
                recordBtn.classList.remove("active");
            }
        }

        // 2. CHAT ROUTER AND RENDERING
        async function sendChat(message) {
            appendLog("User", message);
            status.innerText = "Status: JARVIS responding...";

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                appendLog("JARVIS", data.reply);

                if (data.reply.includes("http")) {
                    const urlMatch = data.reply.match(/(https?:\/\/[^\s]+)/g);
                    if (urlMatch) {
                        const url = urlMatch[0];
                        if (url.includes(".mp4")) {
                            mediaOutput.innerHTML = `<video src="${url}" controls autoplay loop></video>`;
                        } else {
                            mediaOutput.innerHTML = `<img src="${url}" alt="Rendered Media">`;
                        }
                    }
                }

                if ('speechSynthesis' in window) {
                    const speakableText = data.reply.replace(/(https?:\/\/[^\s]+)/g, "Media rendered on screen.");
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.speak(new SpeechSynthesisUtterance(speakableText));
                }

            } catch (err) {
                status.innerText = "Error reaching JARVIS backend.";
            } finally {
                status.innerText = "Status: Standby";
            }
        }

        // 3. WEBSPEECH API IMPLEMENTATION
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;
        let recognizing = false;

        if (recognition) {
            recognition.continuous = false;
            recognition.lang = 'en-US';
            recognition.onstart = () => { status.innerText = "Status: Listening..."; };
            recognition.onerror = (e) => { 
                status.innerText = "Speech Error: " + e.error + " (Use Whisper Fallback)";
                recognizing = false;
                micBtn.innerText = "🎙️ Push to Talk (WebSpeech)";
                micBtn.classList.remove("active");
            };
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                recognizing = false;
                micBtn.innerText = "🎙️ Push to Talk (WebSpeech)";
                micBtn.classList.remove("active");
                if (transcript) sendChat(transcript);
            };
        }

        function toggleWebSpeech() {
            if (!recognition) {
                status.innerText = "WebSpeech unavailable. Use Whisper Fallback.";
                return;
            }
            if (!recognizing) {
                recognition.start();
                recognizing = true;
                micBtn.innerText = "🛑 Stop";
                micBtn.classList.add("active");
            } else {
                recognition.stop();
                recognizing = false;
                micBtn.innerText = "🎙️ Push to Talk (WebSpeech)";
                micBtn.classList.remove("active");
            }
        }

        function appendLog(role, text) {
            const div = document.createElement('div');
            div.className = role.toLowerCase();
            div.innerText = `${role}: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    </script>
</body>
</html>
